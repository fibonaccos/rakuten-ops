[project]
name = "rakuten-mlops"
version = "0.1.0"
description = "Inference platform for Rakuten's products classification"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.3.0",
    "httpx>=0.28.1",
    "ruff>=0.15.0",
]
api = [
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "mlflow>=3.15.1",
    "prometheus-client>=0.26.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "python-jose>=3.5.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.3",
]
benchmark = [
    "locust>=2.46.3",
    "pandas>=2.3.3",
    "psycopg>=3.3.4",
    "psycopg2-binary>=2.9.12",
    "pyarrow>=25.0.1",
    "pyyaml>=6.0.3",
]
inference = [
    "fastapi>=0.141.1",
    "keras>=3.15.1",
    "lxml>=6.1.1",
    "mlflow>=3.15.1",
    "numpy>=2.5.2",
    "prometheus-client>=0.26.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "scikit-learn>=1.9.0",
    "sentence-transformers>=5.7.0",
    "uvicorn>=0.52.3",
]
ml = [
    "joblib>=1.5.3",
    "keras>=3.15.1",
    "lxml>=6.1.1",
    "mlflow>=3.15.1",
    "numpy>=2.5.2",
    "pandas<3.0.0",
    "python-box>=7.4.1",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "scikit-learn>=1.9.0",
    "sentence-transformers>=5.7.0",
]
streamlit = [
    "requests>=2.34.2",
    "streamlit>=1.62.0",
]


[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true


[tool.pytest.ini_options]
# Every service is built as its own image with its own requirements, so each one
# is also tested on its own (see the Makefile). Only the paths shared by all the
# suites live here; a service directory is added by its own tests/<svc>/conftest.py.
pythonpath = [".", "src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning:mlflow.*",
]

[tool.ruff]
line-length = 99
target-version = "py312"
exclude = ["*/requirements.txt"]

[tool.ruff.lint]
# Pinned explicitly rather than extended: ruff's default selection widens between
# releases, and a CI that starts failing on a ruff upgrade is a CI nobody trusts.
# These are the rules that caught real defects in this repository. Import sorting
# ("I") is deliberately left out: enforcing it would rewrite every file and
# collide with everyone's open branches; run
# `uv run ruff check --select I --fix .` when the team wants that pass.
select = [
    "E4",   # imports
    "E7",   # statements
    "E9",   # runtime errors
    "F",    # pyflakes: unused imports, undefined names, dead assignments
    "E722", # bare except
    "F541", # f-string without placeholders
]
