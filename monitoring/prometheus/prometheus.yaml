global:
  scrape_interval: 10s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api-service:8000"]

  - job_name: "inference"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["inference-service:8000"]
